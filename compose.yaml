name: sourcelens-api
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: sourcelens
      POSTGRES_PASSWORD: sourcelens
      POSTGRES_DB: sourcelens
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sourcelens"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:56379:6379"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    command: >
      sh -c "alembic upgrade head &&
             uvicorn sourcelens.main:app --host 0.0.0.0 --port 8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://sourcelens:sourcelens@postgres:5432/sourcelens
      REDIS_URL: redis://redis:6379/0
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  dispatcher:
    build: .
    command: ["python", "-m", "sourcelens.jobs.dispatcher"]
    environment:
      DATABASE_URL: postgresql+psycopg://sourcelens:sourcelens@postgres:5432/sourcelens
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  worker:
    build: .
    command: ["celery", "-A", "sourcelens.jobs.celery_app", "worker", "--loglevel=INFO", "-Q", "ingestion"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://sourcelens:sourcelens@postgres:5432/sourcelens
      REDIS_URL: redis://redis:6379/0
      # The Dockerfile creates and chowns /work for the unprivileged user;
      # the default WORKSPACE_DIR is relative to /app, which is root-owned.
      WORKSPACE_DIR: /work
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
volumes:
  pgdata:
  redisdata:
