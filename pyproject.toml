[project]
name = "source-lens-api"
version = "0.1.0"
description = "Evidence-first repository intelligence"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.8,<3", "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "alembic>=1.15,<2",
  "celery[redis]>=5.5,<6", "structlog>=25,<27",
  "httpx>=0.28,<1", "tree-sitter>=0.25,<0.26",
  "tree-sitter-python>=0.25,<0.26", "tree-sitter-javascript>=0.25,<0.26",
  "tree-sitter-typescript>=0.23,<0.24",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-redis>=4.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sourcelens"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
platform = "linux"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["celery.*", "tree_sitter_python", "tree_sitter_javascript", "tree_sitter_typescript"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL and Redis"]
